<style>

<header><div class="in"><small id="sub">규태와 지영이의</small><h1 id="title">두근두근 외국어공부 💗</h1></div></header>

<script>
/*LOGIC-START*/
// ===== 순수 로직: 채점 / 빈칸 / 로마자 / 엑셀 매핑 =====
const CONTR={"i'm":"i am","you're":"you are","he's":"he is","she's":"she is","it's":"it is","we're":"we are","they're":"they are","i've":"i have","you've":"you have","we've":"we have","they've":"they have","i'll":"i will","you'll":"you will","he'll":"he will","she'll":"she will","we'll":"we will","they'll":"they will","it'll":"it will","that'll":"that will","i'd":"i would","you'd":"you would","he'd":"he would","she'd":"she would","we'd":"we would","they'd":"they would","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","wouldn't":"would not","shouldn't":"should not","couldn't":"could not","haven't":"have not","hasn't":"has not","hadn't":"had not","let's":"let us","that's":"that is","there's":"there is","what's":"what is","where's":"where is","how's":"how is","who's":"who is","here's":"here is","gonna":"going to","wanna":"want to","gotta":"got to"};
const NUM={zero:"0",one:"1",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",eight:"8",nine:"9",ten:"10",eleven:"11",twelve:"12",thirteen:"13",fourteen:"14",fifteen:"15",sixteen:"16",seventeen:"17",eighteen:"18",nineteen:"19",twenty:"20",thirty:"30",forty:"40",fifty:"50",hundred:"100",okay:"ok"};
const STOP=new Set("a an the is am are was were be been being to of in on at for with by from up about into over after and or but if so than then that this these those it its i me my mine you your yours he him his she her hers we us our they them their what which who whom whose when where why how do does did have has had will would can could shall should may might must not no yes there here just very too also all any some each every as please let get got".split(" "));

// LCS: a의 각 원소가 b와 맞았는지
function lcsHits(a,b){
  const n=a.length,m=b.length;const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){hit[i]=true;i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;}
  return hit;
}
// 표시 단위(units)별 정답 여부와 점수
function scoreUnits(units,tokFn,heard){
  const flat=[];units.forEach((u,i)=>tokFn(u.t).forEach(t=>flat.push({t,i})));
  const hit=lcsHits(flat.map(x=>x.t),heard);
  const n=flat.length,matched=hit.filter(Boolean).length;
  const ok=units.map((u,i)=>{let has=false,all=true;flat.forEach((x,k)=>{if(x.i===i){has=true;if(!hit[k])all=false;}});return !has||all;});
  return{pct:n?Math.round(matched/n*100):0,ok};
}

// ---------- 영어 ----------
function parseEn(raw){
  const parts=String(raw||"").trim().split(/\s+/);let inB=false;const words=[];
  for(let p of parts){let mark=inB;if(p.includes("[")){mark=true;inB=true;}const end=p.includes("]");p=p.replace(/[\[\]]/g,"");if(p)words.push({t:p,mark});if(end)inB=false;}
  return words;
}
function normWord(w){
  let s=String(w).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[^a-z0-9'\-]/g,"").replace(/^'+|'+$/g,"");
  if(!s)return[];if(CONTR[s])return CONTR[s].split(" ");
  return s.split("-").filter(Boolean).map(x=>{x=x.replace(/'/g,"");return NUM[x]||x;}).filter(Boolean);
}
function blankIdxEn(words){
  const marked=words.map((w,i)=>w.mark?i:-1).filter(i=>i>=0);if(marked.length)return new Set(marked);
  if(!words.length)return new Set();
  const c=[];words.forEach((w,i)=>{const raw=w.t.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z']/g,"");const core=normWord(w.t).join("");if(core.length>=3&&!STOP.has(raw)&&!CONTR[raw])c.push({i,len:core.length});});
  if(!c.length){const all=words.map((w,i)=>({i,len:w.t.length})).sort((x,y)=>y.len-x.len);return new Set([all[0].i]);}
  const k=Math.max(1,Math.round(words.length*0.35));c.sort((x,y)=>y.len-x.len||x.i-y.i);
  return new Set(c.slice(0,Math.min(k,c.length)).map(x=>x.i));
}
function scoreEn(units,heard){const r=scoreUnits(units,normWord,String(heard||"").split(/\s+/).flatMap(normWord));return{pct:r.pct,line:"text",unitOk:r.ok};}

// ---------- 일본어 ----------
const kataToHira=s=>String(s).replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const JA_TSU={"1つ":"ひとつ","2つ":"ふたつ","3つ":"みっつ","4つ":"よっつ","5つ":"いつつ","6つ":"むっつ","7つ":"ななつ","8つ":"やっつ","9つ":"ここのつ"};
function jaChars(s){
  s=kataToHira(String(s||"").normalize("NFKC")).replace(/[1-9]つ/g,m=>JA_TSU[m]);
  return[...s].filter(ch=>/[ぁ-ゖー一-鿿々a-zA-Z0-9]/.test(ch)).map(c=>c.toLowerCase());
}
function scriptOf(ch){
  if(/[一-鿿々〆]/.test(ch))return"k";
  if(/[゠-ヿｦ-ﾟ]/.test(ch))return"K";
  if(/[ぁ-ゟ]/.test(ch))return"h";
  if(/[A-Za-z0-9０-９Ａ-ｚ]/.test(ch))return"a";
  return"p";
}
// 문장 → 표시 단위 (한자/가타카나/히라가나 덩어리, [대괄호]는 지정 빈칸)
function unitsJa(raw){
  const s=String(raw||"").trim();const out=[];let i=0,buf="",sc=null;
  const flush=()=>{if(buf){out.push({t:buf,mark:false,sc});buf="";sc=null;}};
  while(i<s.length){const ch=s[i];
    if(ch==="["){flush();const j=s.indexOf("]",i+1);const inner=j<0?s.slice(i+1):s.slice(i+1,j);if(inner)out.push({t:inner,mark:true,sc:"m"});i=j<0?s.length:j+1;continue;}
    if(ch==="]"||/\s/.test(ch)){flush();i++;continue;}
    const c=scriptOf(ch);if(c!==sc)flush();sc=c;buf+=ch;i++;}
  flush();return out;
}
function blanksJa(units){
  const marked=units.map((u,i)=>u.mark?i:-1).filter(i=>i>=0);if(marked.length)return{units,blanks:new Set(marked)};
  const total=units.filter(u=>u.sc!=="p").reduce((a,u)=>a+[...u.t].length,0);
  const cand=units.map((u,i)=>({i,len:[...u.t].length,sc:u.sc})).filter(x=>x.sc==="k"||(x.sc==="K"&&x.len>=2)||x.sc==="a");
  if(cand.length){cand.sort((a,b)=>b.len-a.len||a.i-b.i);const pick=[];let used=0;
    for(const c of cand){if(pick.length>=3)break;if(pick.length&&used+c.len>total*0.6)continue;pick.push(c.i);used+=c.len;}
    return{units,blanks:new Set(pick)};}
  // 히라가나만 있는 문장: 가장 긴 덩어리의 가운데를 가림
  let best=-1,bl=0;units.forEach((u,i)=>{const l=[...u.t].length;if(u.sc!=="p"&&l>bl){bl=l;best=i;}});
  if(best<0||bl<2)return{units,blanks:new Set()};
  const ch=[...units[best].t];const a=Math.floor(bl*0.3),b=Math.max(a+1,Math.min(bl,a+Math.ceil(bl*0.4)));
  const parts=[ch.slice(0,a).join(""),ch.slice(a,b).join(""),ch.slice(b).join("")];
  const nu=units.slice(0,best);let bi=-1;
  parts.forEach((p,k)=>{if(p){if(k===1)bi=nu.length;nu.push({t:p,mark:false,sc:"h"});}});
  nu.push(...units.slice(best+1));
  return{units:nu,blanks:new Set(bi>=0?[bi]:[])};
}
// 한자 덩어리 ↔ 읽기 맞추기: 가나 부분을 기준점으로 사이의 읽기를 한자에 배정. 실패하면 null
const hasKanji=t=>/[一-鿿々]/.test(t);
function alignReading(units,reading){
  const r=jaChars(reading).join("");if(!r)return null;
  const alt=units.map(()=>null);let pos=0,pend=[];
  for(let i=0;i<units.length;i++){const u=units[i];const kc=jaChars(u.t).join("");if(!kc)continue;
    if(hasKanji(u.t)){pend.push(i);continue;}
    const idx=r.indexOf(kc,pend.length?pos+1:pos);if(idx<0)return null;
    if(pend.length){if(pend.length>1||idx===pos)return null;alt[pend[0]]=r.slice(pos,idx);pend=[];}
    else if(idx!==pos)return null;
    pos=idx+kc.length;}
  if(pend.length){if(pend.length>1||pos>=r.length)return null;alt[pend[0]]=r.slice(pos);}
  else if(pos!==r.length)return null;
  return alt;
}
// 일본어 채점: 한자는 인식 결과에 한자가 있으면 한자로, 없으면 읽기(가나)로 비교 → 한자로 받아 적든 가나로 받아 적든 공정하게
function scoreJa(units,reading,heard){
  const h=jaChars(heard),hs=h.join("");
  const alt=alignReading(units,reading);
  const toks=String(reading||"").split(/\s+/).filter(Boolean).map(t=>({t}));
  const rd=toks.length?scoreUnits(toks,jaChars,h):null;
  let main;
  if(alt){
    const forms=units.map((u,i)=>{const k=jaChars(u.t);if(alt[i]==null)return k;return hs.includes(k.join(""))?k:[...alt[i]];});
    main=scoreUnits(units.map((u,i)=>({t:i})),i=>forms[i],h);
  }else main=scoreUnits(units,jaChars,h);

const KANA={あ:"a",い:"i",う:"u",え:"e",お:"o",か:"ka",き:"ki",く:"ku",け:"ke",こ:"ko",さ:"sa",し:"shi",す:"su",せ:"se",そ:"so",た:"ta",ち:"chi",つ:"tsu",て:"te",と:"to",な:"na",に:"ni",ぬ:"nu",ね:"ne",の:"no",は:"ha",ひ:"hi",ふ:"fu",へ:"he",ほ:"ho",ま:"ma",み:"mi",む:"mu",め:"me",も:"mo",や:"ya",ゆ:"yu",よ:"yo",ら:"ra",り:"ri",る:"ru",れ:"re",ろ:"ro",わ:"wa",を:"o",ん:"n",が:"ga",ぎ:"gi",ぐ:"gu",げ:"ge",ご:"go",ざ:"za",じ:"ji",ず:"zu",ぜ:"ze",ぞ:"zo",だ:"da",ぢ:"ji",づ:"zu",で:"de",ど:"do",ば:"ba",び:"bi",ぶ:"bu",べ:"be",ぼ:"bo",ぱ:"pa",ぴ:"pi",ぷ:"pu",ぺ:"pe",ぽ:"po",ぁ:"a",ぃ:"i",ぅ:"u",ぇ:"e",ぉ:"o",ゔ:"vu",ゎ:"wa"};
const YOON={ゃ:"ya",ゅ:"yu",ょ:"yo"};
const SMALLV={ぁ:"a",ぃ:"i",ぅ:"u",ぇ:"e",ぉ:"o"};
function toRomaji(tok){
  const s=kataToHira(String(tok).normalize("NFKC"));
  if(s==="は")return"wa";if(s==="へ")return"e";
  let out="";const c=[...s];
  for(let i=0;i<c.length;i++){const ch=c[i],nx=c[i+1];
    if(ch==="っ"){const r=KANA[nx];out+=r?(r.startsWith("ch")?"t":r[0]):"";continue;}
    if(ch==="ー"){const v=out.match(/[aeiou]$/);out+=v?v[0]:"-";continue;}
    let r=KANA[ch];
    if(r===undefined){out+=ch;continue;}
    if(YOON[nx]&&/i$/.test(r)&&r.length>1){const y=YOON[nx];
      if(r==="shi")r="sh"+y[1];else if(r==="chi")r="ch"+y[1];else if(r==="ji")r="j"+y[1];else r=r.slice(0,-1)+y;i++;}
    else if(SMALLV[nx]&&r.length>1){const v=SMALLV[nx];
      if(r==="shi"||r==="chi"||r==="ji")r=r.slice(0,-1)+v;else if(r==="fu")r="f"+v;else if(r==="te")r="t"+v;else if(r==="de")r="d"+v;else r=r.slice(0,-1)+v;i++;}
    else if(SMALLV[nx]&&r==="u"){r="w"+SMALLV[nx];i++;}
    if(ch==="ん"&&nx&&/^[aiueoy]/.test(KANA[nx]||""))r="n'";
    out+=r;}
  return out;
}
function romajiLine(reading){return String(reading||"").split(/\s+/).filter(Boolean).map(toRomaji).join(" ");}

function parseCSV(text){
  text=String(text).replace(/^﻿/,"");const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;else if(ch===","){row.push(cell);cell="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell="";}
    else cell+=ch;}
  if(cell!==""||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}
// 엑셀 행 → [{lang,cat,text,reading,ko,memo}]
function rowsToItems(rows,defLang){
  if(!rows.length)return[];
  const head=rows[0].map(x=>String(x||"").trim().toLowerCase());const used=new Set();
  const find=re=>{const i=head.findIndex((h,k)=>!used.has(k)&&re.test(h));if(i>=0)used.add(i);return i;};
  const ko=find(/한국어|뜻|해석|korean|meaning/),lang=find(/^언어$|^lang/),cat=find(/카테고리|분류|category/),
        rd=find(/읽기|reading|후리가나|요미|발음/),memo=find(/메모|memo|note/),tx=find(/문장|영어|일본어|sentence|text/);
  const g=(r,i)=>i>=0?String(r[i]??"").trim():"";
  let items;
  const isHead=head.some(h=>/문장|sentence|text|카테고리|category|뜻|meaning/.test(h));
  if(tx>=0&&isHead){items=rows.slice(1).map(r=>({lang:LANG_IN[g(r,lang).toLowerCase()]||defLang,cat:g(r,cat),text:g(r,tx),reading:g(r,rd),ko:g(r,ko),memo:g(r,memo)}));}
  else items=rows.map(r=>{const L=LANG_IN[String(r[0]||"").trim().toLowerCase()];
    return L?{lang:L,cat:g(r,1),text:g(r,2),reading:g(r,3),ko:g(r,4),memo:g(r,5)}:{lang:defLang,cat:g(r,0),text:g(r,1),reading:"",ko:g(r,2),memo:g(r,3)};});
  return items.filter(x=>x.text);
}

async function sync(manual){
  const url=S.settings.sheetUrl;
  if(!url){if(manual)toast("설정에서 구글 시트 주소를 먼저 넣어 주세요");return;}
  if(syncing)return;if(!navigator.onLine){S.syncErr="인터넷 연결 없음";refreshSyncViews();return;}
  syncing=true;refreshSyncViews();
  const bad=r=>!r||!r.ok||!Array.isArray(r.sentences);
  const badMsg=r=>(r&&r.error)||"시트 응답이 이상해요. 주소가 /exec 로 끝나는지 확인해 주세요";
  try{
    if(!S.connected){
      const r=await getJSON(qs(url,{action:"pull",from:0}));if(bad(r))throw new Error(badMsg(r));
      S.serverV=r.v||1;
      const have=new Set(r.sentences.map(s=>s.id));const ups=S.sentences.filter(s=>!have.has(s.id)).map(s=>({op:"upsert",s}));
      const dh=new Set((r.decks||[]).map(d=>d.id));const dups=S.decks.filter(d=>!dh.has(d.id)).map(d=>({op:"deckUpsert",d}));
      S.outbox=[...ups,...dups,...S.outbox.filter(o=>o.op==="log")];S.connected=true;S.logRow=0;save();
    }
    for(let pass=0;pass<2;pass++){
      const can=o=>S.serverV>=2||!V2OP(o);
      let todo=S.outbox.filter(can);
      while(todo.length){const chunk=todo.slice(0,150);const r=await postJSON(url,{ops:chunk});if(!r.ok)throw new Error(r.error||"저장 실패");
        const sent=new Set(chunk);S.outbox=S.outbox.filter(o=>!sent.has(o));todo=todo.slice(chunk.length);save();}
      let r=await getJSON(qs(url,{action:"pull",from:S.logRow}));if(bad(r))throw new Error(badMsg(r));
      if(r.total<S.logRow){r=await getJSON(qs(url,{action:"pull",from:0}));if(bad(r))throw new Error(badMsg(r));S.logs=[];}
      const map=new Map(S.logs.map(l=>[l.id,l]));r.logs.forEach(l=>map.set(l.id,l));
      S.outbox.forEach(o=>{if(o.op==="log"&&!map.has(o.row.id))map.set(o.row.id,o.row);});
      S.logs=[...map.values()];S.logRow=r.total;S.sentences=r.sentences;S.serverV=r.v||1;
      if(Array.isArray(r.decks)){let D=r.decks;S.outbox.forEach(o=>{if(o.op==="deckUpsert"){D=D.filter(d=>d.id!==o.d.id);D.push(o.d);}else if(o.op==="deckDelete")D=D.filter(d=>d.id!==o.id);});S.decks=D;}
      if(!S.outbox.some(o=>S.serverV>=2||!V2OP(o)))break;
    }
    S.lastSync=new Date().toISOString();
    S.syncErr=S.serverV<2&&S.outbox.some(V2OP)?"시트 코드(Code.gs)를 새 버전으로 바꿔 주세요":"";save();
    if(manual)toast(S.syncErr||"동기화했어요");
  }catch(e){S.syncErr=String(e.message||e);if(manual)toast("동기화 실패: "+S.syncErr);}
  finally{syncing=false;refreshSyncViews();}
}

  let fin=false;const f=()=>{if(!fin){fin=true;clearTimeout(t);res();}};u.onend=f;u.onerror=f;
  const t=setTimeout(f,3000+(lang==="en"?text.split(" ").length*600:[...text].length*250));

function loadSpeechSDK(){
  if(window.SpeechSDK)return Promise.resolve(window.SpeechSDK);
  if(SPEECH.loading)return SPEECH.loading;
  SPEECH.loading=new Promise((resolve,reject)=>{
    const script=document.createElement("script");script.src=SPEECH_SDK_URL;script.async=true;
    const timer=setTimeout(()=>fail(),15000);
    const fail=()=>{clearTimeout(timer);script.remove();SPEECH.loading=null;reject({error:"sdk-load"});};
    script.onload=()=>{clearTimeout(timer);if(window.SpeechSDK)resolve(window.SpeechSDK);else fail();};
    script.onerror=fail;document.head.appendChild(script);
  });return SPEECH.loading;
}
async function getSpeechToken(signal,force){
  if(!SPEECH.code)throw {error:"speech-code"};
  const url=speechUrl(),code=SPEECH.code;
  const cached=SPEECH.token;
  if(!force&&cached&&cached.url===url&&cached.code===code&&cached.expiresAt>Date.now()+30000)return cached;
  let response;
  try{response=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action:"azureToken",accessCode:code}),redirect:"follow",cache:"no-store",signal});}
  catch(e){throw {error:signal&&signal.aborted?"aborted":"network"};}
  if(!response.ok)throw {error:"token-server"};
  let result;try{result=await response.json();}catch(e){throw {error:"token-server"};}
  if(!result.ok){
    SPEECH.token=null;
    throw {error:result.error==="SPEECH_UNAUTHORIZED"?"speech-code":result.error==="SPEECH_NOT_CONFIGURED"?"speech-config":"token-server"};
  }
  if(typeof result.token!=="string"||!result.token||result.region!=="eastus"||!(result.expiresAt>Date.now()+30000))throw {error:"token-server"};
  const value={token:result.token,region:result.region,expiresAt:result.expiresAt,url,code};
  if(code===SPEECH.code&&url===speechUrl())SPEECH.token=value;
  return value;
}
function azureError(e){
  if(e&&e.error)return e;
  const name=e&&e.name;
  if(name==="NotAllowedError"||name==="SecurityError")return {error:"not-allowed"};
  if(name==="NotFoundError"||name==="NotReadableError")return {error:"audio-capture"};
  return {error:"network"};
}
function listen(lang){return new Promise((resolve,reject)=>{
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return reject({error:"unsupported"});
  let done=false,recognizer=null,audio=null,mic=null,hard=null,prepareTimer=null;
  const controller=new AbortController();
  const finish=(error,alts=[])=>{
    if(done)return;done=true;clearTimeout(hard);clearTimeout(prepareTimer);controller.abort();
    if(REC===session)REC=null;
    stopRecording();
    try{if(recognizer)recognizer.close();}catch(e){}
    try{if(audio)audio.close();}catch(e){}
    if(mic)mic.getTracks().forEach(t=>t.stop());
    if(error)reject(azureError(error));else resolve({alts});
  };
  const session={abort:()=>finish(null)};REC=session;
  prepareTimer=setTimeout(()=>finish({error:"network"}),20000);
  (async()=>{try{
    const [sdk,auth]=await Promise.all([loadSpeechSDK(),getSpeechToken(controller.signal)]);
    if(done)return;
    mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});
    if(done){mic.getTracks().forEach(t=>t.stop());return;}
    const config=sdk.SpeechConfig.fromAuthorizationToken(auth.token,auth.region);
    config.speechRecognitionLanguage=speechLang(lang);config.outputFormat=sdk.OutputFormat.Detailed;
    config.setProperty(sdk.PropertyId.SpeechServiceConnection_InitialSilenceTimeoutMs,"7000");
    config.setProperty(sdk.PropertyId.SpeechServiceConnection_EndSilenceTimeoutMs,"1600");
    audio=sdk.AudioConfig.fromStream(mic);
    sdk.SpeechRecognizer.enableTelemetry(false);
    recognizer=new sdk.SpeechRecognizer(config,audio);
    recognizer.sessionStarted=()=>{if(done)return;clearTimeout(prepareTimer);hard=setTimeout(()=>finish(null),15000);
      setStatus("speak",P.round===3&&!P.review?"🎙 기억해서 외국어로 말해 보세요":"🎙 따라 말하세요");};
    recognizer.recognizing=(_,event)=>{if(done)return;P.interim=event.result.text||"";const el=$("#heard");if(el)el.textContent="🗣 "+P.interim;};
    recognizer.canceled=(_,event)=>{
      if(done)return;
      if(event.reason===sdk.CancellationReason.Error){
        if(event.errorCode===sdk.CancellationErrorCode.AuthenticationFailure){SPEECH.token=null;finish({error:"azure-auth"});}
        else finish({error:"network"});
      }else finish(null);
    };
    if(S.settings.record)await startRecording(mic);
    if(done)return;
    recognizer.recognizeOnceAsync(result=>{
      if(done)return;
      if(result.reason===sdk.ResultReason.RecognizedSpeech){
        const alts=[result.text];
        try{const detail=JSON.parse(result.json);(detail.NBest||[]).forEach(x=>{if(x.Display||x.Lexical)alts.push(x.Display||x.Lexical);});}catch(e){}
        finish(null,[...new Set(alts.filter(Boolean))]);
      }else if(result.reason===sdk.ResultReason.Canceled)finish({error:"network"});
      else finish(null);
    },()=>finish({error:"network"}));
  }catch(e){finish(e);}})();
});}

const T={start:0,acc:0,lang:null};
function tStart(lang){if(T.lang&&T.lang!==lang)tFlush();T.lang=lang;if(!T.start)T.start=Date.now();}
function tPause(){if(T.start){T.acc+=Math.min(Date.now()-T.start,30*60000);T.start=0;}if(T.acc>=5*60000)tFlush();}
function tFlush(){tPause0();if(T.acc>=5000&&T.lang)addLog({kind:"time",lang:T.lang,sec:Math.round(T.acc/1000)});T.acc=0;}
function tPause0(){if(T.start){T.acc+=Math.min(Date.now()-T.start,30*60000);T.start=0;}}

function modeLabel(m){if(!m)return"";

function buildQueue(m){
  if(m.kind==="deck"){const d=deckById(m.deckId);return d?d.sids.filter(byId):[];}
  if(m.kind==="ids")return(m.ids||[]).filter(byId);

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// 약한 문장 우선 가중치: 틀림 +3, 점수 낮음 +2, 처음 +1, 오래 안 함 최대 +3, 완료는 덜 뽑힘
function weightOf(sid){const m=myPeek(sid);let w=1;
  if(m.status==="failed")w+=3;if(m.tries&&m.best<S.settings.threshold)w+=2;if(!m.tries)w+=1;
  if(m.last){const days=(new Date(localDate()+"T00:00:00")-new Date(m.last+"T00:00:00"))/864e5;w+=Math.min(3,Math.max(0,days/3));}
  if(m.status==="done")w*=0.6;return w;}
function pickWeighted(ids,n){const pool=ids.map(id=>({id,w:weightOf(id)}));const out=[];
  while(out.length<n&&pool.length){const tot=pool.reduce((a,x)=>a+x.w,0);let r=Math.random()*tot,k=0;
    for(;k<pool.length-1;k++){r-=pool[k].w;if(r<=0)break;}out.push(pool[k].id);pool.splice(k,1);}
  return out;}

async function cycle(skipTTS){
  const g=++P.gen;P.running=true;P.result=null;P.interim="";P.hint=false;
  const s=cur();if(!s){stopP("문장을 찾을 수 없어요");return;}
  tStart(s.lang);
  const pr=getPrep();const text=plainText(s.lang,s.text);
  const r3=P.round===3&&!P.review;
  if(!skipTTS){
    if(r3){setStatus("listen","🔊 한국어 뜻을 들려드릴게요");await speak(s.ko,"ko");}
    else{setStatus("listen",P.review?"🔊 정답을 잘 들어 보세요":"🔊 듣는 중…");await speak(text,s.lang);}
    if(g!==P.gen)return;await sleep(200);if(g!==P.gen)return;}
  setStatus("listen","☁️ Azure 음성인식 준비 중…");
  let res;try{res=await listen(s.lang);}catch(e){if(g!==P.gen)return;stopP(errMsg(e));return;}
  if(g!==P.gen)return;
  const alts=(res.alts||[]).filter(a=>a&&a.trim());
  if(!alts.length){P.noSpeech++;
    if(P.noSpeech>=2){P.noSpeech=0;stopP("소리가 들리지 않아 멈췄어요. ▶ 를 누르면 다시 시작해요.");return;}
    setStatus("warn","소리가 안 들렸어요. 다시 들려드릴게요");await sleep(W("quiet"));if(g!==P.gen)return;return cycle();}
  P.noSpeech=0;
  let best=null;for(const a of alts){const r=scoreAny(s.lang,pr.units,s.reading,a);if(!best||r.pct>best.pct)best={...r,heard:a};}
  P.result=best;const pass=best.pct>=S.settings.threshold;const max=S.settings.maxFail;
  // 3회차 복습: 정답 따라 하기 (실패 횟수에 안 셈)
  if(P.review){
    if(pass){setStatus("ok","👍 좋아요! 다시 한국어 뜻으로 도전해요");await sleep(W("pass"));if(g!==P.gen)return;P.review=false;P.reviewFails=0;P.prep=null;return cycle();}
    P.reviewFails++;
    if(P.reviewFails>=3){setStatus("warn","다시 한국어 뜻으로 도전해 볼게요");await sleep(W("r3"));if(g!==P.gen)return;P.review=false;P.reviewFails=0;P.prep=null;return cycle();}
    setStatus("bad","한 번 더 따라 해 볼게요");await sleep(W("r3"));if(g!==P.gen)return;return cycle();}
  if(!pass)P.fails++;
  const skip=!pass&&P.fails>=max;const last=P.round>=maxRound(s);
  addLog({kind:"try",lang:s.lang,sid:s.id,text,round:P.round,score:best.pct,result:pass?"통과":skip?"넘김":"실패"});
  if(pass){setStatus("ok",`✅ 통과! (${P.round}회차)`);await sleep(W("pass"));if(g!==P.gen)return;
    if(!last){P.round++;P.fails=0;P.peek=false;P.prep=null;savePos();return cycle();}
    P.sess.scores[s.id]=best.pct;if(!P.sess.done.includes(s.id))P.sess.done.push(s.id);P.sess.failed=P.sess.failed.filter(x=>x!==s.id);save();return advance(g);}
  if(skip){P.sess.scores[s.id]=best.pct;if(!P.sess.failed.includes(s.id))P.sess.failed.push(s.id);save();
    setStatus("bad",`${P.fails}번 실패 — 다음 문장으로 넘어가요`);await sleep(W("skip"));if(g!==P.gen)return;return advance(g);}
  save();
  if(P.round===3){setStatus("bad",`아쉬워요 (${P.fails}/${max}) — 정답을 들려드릴게요`);await sleep(W("r3"));if(g!==P.gen)return;P.review=true;P.reviewFails=0;P.prep=null;return cycle();}
  setStatus("bad",`다시 해볼게요 (${P.fails}/${max})`);await sleep(W("fail"));if(g!==P.gen)return;return cycle();

function inPeriod(date,period){const td=localDate();if(period==="today")return date===td;if(period==="week")return date>=mondayOf(td)&&date<=td;if(period==="month")return date.slice(0,7)===td.slice(0,7);return true;}
function sumUser(user,logs){const mine=logs.filter(l=>l.user===user);const tries=mine.filter(l=>l.kind==="try");
  const sec=mine.filter(l=>l.kind==="time").reduce((a,l)=>a+(+l.sec||0),0);const pass=tries.filter(l=>l.result==="통과").length;
  return{sec,tries:tries.length,pass,sents:new Set(tries.map(l=>l.sid)).size,rate:tries.length?Math.round(pass/tries.length*100):0};}
function activeDays(user){return new Set(S.logs.filter(l=>l.user===user&&(l.kind==="try"||l.kind==="time")).map(l=>l.date));}
function streak(user){const set=activeDays(user);let d=localDate();if(!set.has(d))d=addDays(d,-1);let n=0;while(set.has(d)){n++;d=addDays(d,-1);}return n;}
function cheer(){const td=S.logs.filter(l=>l.date===localDate()&&l.kind==="try");const n=new Set(td.map(l=>l.user+l.sid)).size;
  if(!n)return"오늘도 같이 두근두근 공부해 볼까요? 💗";if(n<10)return`오늘 둘이 합쳐 ${n}문장! 좋은 출발이에요 ✨`;if(n<30)return`오늘 둘이 합쳐 ${n}문장! 잘하고 있어요 👏`;return`오늘 둘이 합쳐 ${n}문장!! 최고의 커플 스터디 🏆`;}

function chartSVG(days,logs){
  const end=localDate();const dates=[...Array(days)].map((_,k)=>addDays(end,k-days+1));
  const sec={};logs.filter(l=>l.kind==="time").forEach(l=>{const k=l.user+"|"+l.date;sec[k]=(sec[k]||0)+(+l.sec||0);});
  const vals=USERS.map(u=>dates.map(d=>Math.round((sec[u+"|"+d]||0)/60)));
  let mx=Math.max(10,...vals.flat());mx=Math.ceil(mx/10)*10;
  const W=340,H=180,L=28,B=24,T=8,cw=(W-L-4)/days,bw=Math.max(2,cw*(days>7?0.36:0.3));
  const y=v=>T+(H-T-B)*(1-v/mx);const wd="일월화수목금토";
  let g="";[0,mx/2,mx].forEach(v=>{g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#f3e3e3"/><text x="${L-5}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="#8c7a80">${v}</text>`;});
  dates.forEach((d,i)=>{const x0=L+i*cw+cw/2;USERS.forEach((u,ui)=>{const v=vals[ui][i];if(v>0){const yy=y(v);g+=`<rect x="${x0+(ui?1:-bw-1)}" y="${yy}" width="${bw}" height="${H-B-yy}" rx="${Math.min(3,bw/2)}" fill="${UHEX[u]}"/>`;}});
    const dt=new Date(d+"T00:00:00");const show=days<=7||i%5===4||i===days-1;
    if(show)g+=`<text x="${x0}" y="${H-8}" font-size="10" text-anchor="middle" fill="${d===end?"#ff6f86":"#8c7a80"}">${days<=7?dt.getDate()+"("+wd[dt.getDay()]+")":dt.getMonth()+1+"/"+dt.getDate()}</text>`;});
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}</svg>`;
}
function heatSVG(user,logs){
  const end=localDate();const start=addDays(mondayOf(end),-7*11);
  const sec={},act=new Set();logs.filter(l=>l.user===user&&(l.kind==="try"||l.kind==="time")).forEach(l=>{act.add(l.date);if(l.kind==="time")sec[l.date]=(sec[l.date]||0)+(+l.sec||0);});
  const cs=20,gp=4,L=22;let g="";["월","","수","","금","","일"].forEach((t,r)=>{if(t)g+=`<text x="0" y="${16+r*(cs+gp)+cs/2}" font-size="10" fill="#8c7a80">${t}</text>`;});
  for(let w=0;w<12;w++)for(let r=0;r<7;r++){const d=addDays(start,w*7+r);if(d>end)continue;const m=(sec[d]||0)/60;
    const lv=m>=30?1:m>=15?.75:m>=5?.5:(m>0||act.has(d))?.28:0;
    const x=L+w*(cs+gp),yy=10+r*(cs+gp);
    g+=`<rect x="${x}" y="${yy}" width="${cs}" height="${cs}" rx="5" fill="${lv?UHEX[user]:"#f6ecec"}" fill-opacity="${lv||1}" ${d===end?'stroke="#3b2a2f" stroke-width="1.5"':""}><title>${d} ${Math.round(m)}분</title></rect>`;}
  const W=L+12*(cs+gp),H=10+7*(cs+gp);
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:420px">${g}</svg>`;
}

  <div class="card"><div class="set"><div class="t fun" style="font-size:17px">사용자<div class="d">이 기기에서 기록하는 이름</div></div><div class="seg">${USERS.map(u=>`<button class="${S.me===u?"on":""}" onclick="setMe('${u}')">${u}</button>`).join("")}</div></div></div>
  <div class="card"><h2>☁️ 구글 시트 연결</h2>
    <label class="f">Apps Script 웹 앱 주소</label><input type="url" id="sheetUrl" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(st.sheetUrl)}">
    <div class="row" style="margin-top:10px"><button class="btn sm" onclick="testUrl()">연결 테스트</button><button class="btn sm pri" onclick="saveUrl()">저장하고 연결</button><button class="btn sm" onclick="sync(true)">지금 동기화</button></div>
    <div class="muted small" style="margin-top:10px">${syncLine()}</div>
    <div class="muted small" style="margin-top:6px">아이폰은 사파리와 홈 화면 앱의 저장 공간이 따로라서, 홈 화면에 추가한 뒤에 앱 안에서도 주소를 한 번 넣어 주세요.</div></div>
  <div class="card"><h2>🎙 Azure 음성인식</h2>
    <p class="muted small">영어·일본어 음성인식은 Microsoft Azure를 사용해요. 말할 때 마이크 권한과 인터넷 연결이 필요하며, 음성이 Azure로 전송돼요.</p>
    <label class="f" for="speechCode">연결 암호</label><input type="password" id="speechCode" autocomplete="off" placeholder="정해 둔 연결 암호" value="${esc(SPEECH.draft??SPEECH.code)}" oninput="SPEECH.draft=this.value">
    <div class="row" style="margin-top:10px"><button class="btn sm pri" onclick="saveSpeechCode()">암호 저장</button><button class="btn sm" onclick="testSpeechConnection()" ${SPEECH.testing?"disabled":""}>연결 테스트</button></div>
    <p class="muted small" role="status">${esc(SPEECH.message||(SPEECH.code?"연결 암호가 저장돼 있어요.":"연결 암호를 입력하고 저장해 주세요."))}</p>
    <p class="muted small">연결 암호는 이 탭에서 유지돼요. 새 기기나 새 탭에서는 다시 입력해 주세요.</p></div>

  <div class="card"><h2>연습</h2>
    <div class="set" style="display:block"><div class="row" style="justify-content:space-between"><div class="t">통과 기준</div><b class="fun" style="font-weight:400">${st.threshold}점</b></div>
      <input type="range" min="50" max="100" step="5" value="${st.threshold}" oninput="this.previousElementSibling.lastElementChild.textContent=this.value+'점'" onchange="setS('threshold',+this.value)">
      <div class="d">1·2·3회차 모두 이 점수 이상이면 통과예요 (영어는 단어, 일본어는 글자 단위 비교)</div></div>
    <div class="set"><div class="t">진행 속도<div class="d">통과·실패 뒤 다음으로 넘어가기 전 기다리는 시간</div></div><div class="seg">${[["slow","느리게"],["normal","보통"],["fast","빠르게"]].map(([v,l])=>`<button class="${st.speed===v?"on":""}" onclick="setS('speed','${v}')">${l}</button>`).join("")}</div></div>
    <div class="set"><div class="t">실패 허용<div class="d">한 회차에서 이만큼 틀리면 다음 문장으로 넘어가요 (3회차 정답 따라 하기는 안 셈)</div></div><select style="width:90px" onchange="setS('maxFail',+this.value)">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===st.maxFail?"selected":""}>${n}번</option>`).join("")}</select></div>
    <div class="set"><div class="t">한국어 뜻 기본 표시</div><label class="sw"><input type="checkbox" ${st.showKo?"checked":""} onchange="P.showKo=null;setS('showKo',this.checked)"><span></span></label></div>
    <div class="set"><div class="t">일본어 읽기·로마자 기본 표시</div><label class="sw"><input type="checkbox" ${st.showRead?"checked":""} onchange="P.showRead=null;setS('showRead',this.checked)"><span></span></label></div>
    <div class="set"><div class="t">내 발음 녹음 (실험 기능)<div class="d">말한 걸 녹음해서 다시 들을 수 있어요. 기기에서 녹음을 지원하면 Azure 음성인식과 함께 녹음해요.</div></div><label class="sw"><input type="checkbox" ${st.record?"checked":""} onchange="setS('record',this.checked)"><span></span></label></div></div>
  <div class="card"><h2>목소리</h2>
    <div class="set"><div class="t">🇺🇸 영어 억양</div><div class="seg"><button class="${st.accent==="en-US"?"on":""}" onclick="S.settings.voiceEn='';setS('accent','en-US')">미국</button><button class="${st.accent==="en-GB"?"on":""}" onclick="S.settings.voiceEn='';setS('accent','en-GB')">영국</button></div></div>
    <div class="set"><div class="t">🇺🇸 영어</div><select style="width:150px" onchange="setS('voiceEn',this.value)"><option value="">자동</option>${ve.map(v=>`<option ${v.name===st.voiceEn?"selected":""}>${esc(v.name)}</option>`).join("")}</select><button class="btn sm" onclick="speak('Hello! Nice to meet you.','en')">🔊</button></div>
    <div class="set"><div class="t">🇯🇵 일본어</div><select style="width:150px" onchange="setS('voiceJa',this.value)"><option value="">자동</option>${vj.map(v=>`<option ${v.name===st.voiceJa?"selected":""}>${esc(v.name)}</option>`).join("")}</select><button class="btn sm" onclick="speak('こんにちは。よろしくお願いします。','ja')">🔊</button></div>
    <div class="set"><div class="t">🇰🇷 한국어<div class="d">3회차에서 뜻을 읽어 줄 때</div></div><select style="width:150px" onchange="setS('voiceKo',this.value)"><option value="">자동</option>${voicesFor("ko").map(v=>`<option ${v.name===st.voiceKo?"selected":""}>${esc(v.name)}</option>`).join("")}</select><button class="btn sm" onclick="speak('안녕하세요. 오늘도 화이팅!','ko')">🔊</button></div></div>
  <div class="card"><h2>데이터</h2>
    <div class="grid2"><button class="btn" onclick="resetMine()">내 완료·틀림 표시 초기화</button><button class="btn danger" onclick="resetAll()">예시로 초기화</button></div>
    <p class="muted small">공부 기록(시간·점수)은 구글 시트에 남아요. 시트를 연결하지 않으면 이 기기에만 저장돼요.</p></div>`;
}
function resetMine(){if(!confirm("내 완료·틀림 표시를 처음 상태로 돌릴까요? (공부 기록·별표는 그대로)"))return;addLog({kind:"reset",lang:S.lang,result:"초기화"});S.pos=null;save();toast("초기화했어요");}
function resetAll(){if(S.settings.sheetUrl){toast("시트가 연결돼 있어요. 문장은 구글 시트에서 직접 정리해 주세요");return;}
  if(!confirm("모든 문장을 지우고 예시 문장으로 되돌릴까요?"))return;S.sentences=seed();S.pos=null;P.queue=[];save();toast("초기화했어요");renderSettings();}

// ===== 화면 전환 =====
let view="home";
const TITLES={home:"두근두근 외국어공부 💗",practice:"연습 🎧",stats:"공부 기록 📊",manage:"문장 관리 📝",settings:"설정 ⚙️"};
function go(v){
  if(view==="practice"&&v!=="practice"&&P.running)stopP("⏸ 멈췄어요. ▶ 로 이어서 해요",true);
  view=v;$("#title").textContent=TITLES[v];$("#sub").textContent=v==="home"?"규태와 지영이의":"규태와 지영이의 두근두근 외국어공부";
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  ({home:renderHome,practice:renderP,stats:renderStats,manage:renderManage,settings:renderSettings})[v]();
  window.scrollTo(0,0);
  if(v==="home"||v==="stats")sync();
}
go("home");
if(!S.me)chooseUser(true);
document.addEventListener("visibilitychange",()=>{if(document.hidden){if(P.running)stopP("⏸ 멈췄어요. ▶ 로 이어서 해요",true);else tFlush();}else sync();});
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  const hadController=!!navigator.serviceWorker.controller;let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadController&&!reloading){reloading=true;location.reload();}});
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
}

</script>
</body>
